name: Glassycode Desktop Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Build a release or point a channel at an existing release"
        required: true
        default: build
        type: choice
        options:
          - build
          - promote
      channel:
        description: "Desktop release channel"
        required: true
        default: production
        type: choice
        options:
          - production
          - candidate
      version:
        description: "Semver for builds, or the exact archived version for promotion"
        required: true
        type: string
      ref:
        description: "Git ref to build"
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: glassycode-desktop-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish macOS
    if: inputs.action == 'build'
    runs-on: macos-15
    timeout-minutes: 60
    environment: releases
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
      T3CODE_DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_BASE_URL }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
      DESKTOP_UPDATE_BUCKET: ${{ vars.DESKTOP_UPDATE_BUCKET }}
      DESKTOP_UPDATE_PREFIX: ${{ vars.DESKTOP_UPDATE_PREFIX }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Validate release configuration
        run: |
          set -euo pipefail
          for name in \
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION AWS_ENDPOINT_URL_S3 \
            DESKTOP_UPDATE_BUCKET T3CODE_DESKTOP_UPDATE_URL \
            T3CODE_CLERK_PUBLISHABLE_KEY T3CODE_CLERK_JWT_TEMPLATE \
            T3CODE_CLERK_CLI_OAUTH_CLIENT_ID T3CODE_RELAY_URL \
            CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then
              echo "Missing release configuration: $name" >&2
              exit 1
            fi
          done

      - name: Resolve version and manifest
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Build versions must use MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if [ "$INPUT_CHANNEL" = candidate ]; then
            version="${version}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            manifest="nightly-mac.yml"
          else
            manifest="latest-mac.yml"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Prepare notarization key
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.release.outputs.version }}"

      - name: Build signed and notarized application
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ steps.release.outputs.version }}" \
            --signed \
            --verbose

      - name: Publish immutable artifacts and channel manifest
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MANIFEST: ${{ steps.release.outputs.manifest }}
        run: |
          set -euo pipefail
          prefix="${DESKTOP_UPDATE_PREFIX#/}"
          prefix="${prefix%/}"
          root="s3://${DESKTOP_UPDATE_BUCKET}"
          if [ -n "$prefix" ]; then root="$root/$prefix"; fi

          manifest_path="release/$MANIFEST"
          version_root="$root/releases/$VERSION"
          if [ ! -f "$manifest_path" ]; then
            echo "Missing updater manifest: $manifest_path" >&2
            exit 1
          fi

          shopt -s nullglob
          for artifact in release/*.dmg release/*.zip release/*.blockmap; do
            aws s3 cp "$artifact" "$root/$(basename "$artifact")" \
              --endpoint-url "$AWS_ENDPOINT_URL_S3" \
              --cache-control "public,max-age=31536000,immutable"
            aws s3 cp "$artifact" "$version_root/$(basename "$artifact")" \
              --endpoint-url "$AWS_ENDPOINT_URL_S3" \
              --cache-control "public,max-age=31536000,immutable"
          done
          aws s3 cp "$manifest_path" "$version_root/$MANIFEST" \
            --endpoint-url "$AWS_ENDPOINT_URL_S3" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "$manifest_path" "$root/$MANIFEST" \
            --endpoint-url "$AWS_ENDPOINT_URL_S3" \
            --cache-control "no-cache"

      - name: Publish release catalog
        if: ${{ success() && inputs.action == 'build' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ inputs.ref }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          if [ "$RELEASE_CHANNEL" = candidate ]; then
            catalog_channel="nightly"
          else
            catalog_channel="stable"
          fi
          catalog_generated_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          catalog_branch="${RELEASE_BRANCH#refs/heads/}"
          build_id="desktop-$RELEASE_VERSION"
          update_id="$catalog_channel-$RELEASE_VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            node scripts/update-release-catalog.ts \
              --version "$RELEASE_VERSION" \
              --commit-sha "$RELEASE_COMMIT_SHA" \
              --channel "$catalog_channel" \
              --build-id "$build_id" \
              --update-id "$update_id" \
              --platform desktop \
              --architecture arm64 \
              --branch "$catalog_branch" \
              --generated-at "$catalog_generated_at"

            if git diff --quiet -- release-catalog.json; then
              echo "Release catalog already contains $RELEASE_VERSION ($catalog_channel)."
              exit 0
            fi

            git add release-catalog.json
            git commit -m "chore(releases): publish desktop release catalog"
            if git push origin HEAD:main; then
              echo "Published $RELEASE_VERSION to the release catalog."
              exit 0
            fi
            echo "Catalog push raced with another update; retrying (attempt $((attempt + 1))/5)."
          done

          echo "Could not publish the release catalog after 5 attempts." >&2
          exit 1

  promote:
    name: Promote existing desktop release
    if: inputs.action == 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: releases
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
      DESKTOP_UPDATE_BUCKET: ${{ vars.DESKTOP_UPDATE_BUCKET }}
      DESKTOP_UPDATE_PREFIX: ${{ vars.DESKTOP_UPDATE_PREFIX }}
    steps:
      - name: Point channel at archived release
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          prefix="${DESKTOP_UPDATE_PREFIX#/}"
          prefix="${prefix%/}"
          root="s3://${DESKTOP_UPDATE_BUCKET}"
          if [ -n "$prefix" ]; then root="$root/$prefix"; fi
          if [ "$CHANNEL" = candidate ]; then
            manifest="nightly-mac.yml"
          else
            manifest="latest-mac.yml"
          fi

          aws s3 cp "$root/releases/$VERSION/$manifest" "$root/$manifest" \
            --endpoint-url "$AWS_ENDPOINT_URL_S3" \
            --cache-control "no-cache"
